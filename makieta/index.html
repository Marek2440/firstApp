<style>
/* Układ: górny pasek z zakładkami ekranów, pod nim siatka 12 kolumn z oknami, które przesuwasz i powiększasz. */
:root {
  --bg: #E9EDF1; --surface: #FFFFFF; --sunk: #F3F5F8; --ink: #17212C; --muted: #5B6876; --line: #D3DAE2;
  --accent: #2F55C8; --accent-ink: #FFFFFF; --accent-soft: #E3E9FA; --guide: rgba(47, 85, 200, .06);
  --ok: #1E7F52; --ok-soft: #DFF1E7; --warn: #A86A00; --warn-soft: #FBEFD6; --crit: #C0362C; --crit-soft: #F9E1DE;
  --s1: #D9534F; --s2: #2F6FDB; --s3: #6A5ACD; --s4: #1E9E78; --s5: #0F7C8C; --s6: #C7743A; --s7: #4A4F57; --s8: #8A6D3B;
  --shadow: 0 1px 2px rgba(23, 33, 44, .06), 0 4px 14px rgba(23, 33, 44, .06);
  --shadow-lift: 0 10px 30px rgba(23, 33, 44, .18);
  --f-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1318; --surface: #161D25; --sunk: #1B232D; --ink: #E4E9EF; --muted: #94A1AF; --line: #29333F;
    --accent: #7F9BFF; --accent-ink: #0E1318; --accent-soft: #1F2945; --guide: rgba(127, 155, 255, .06);
    --ok: #4CC08A; --ok-soft: #14302A; --warn: #E3A93B; --warn-soft: #33280F; --crit: #F0766B; --crit-soft: #3A1C1A;
    --s1: #F07A76; --s2: #6E9BF0; --s3: #9B8CF0; --s4: #4CC7A0; --s5: #45B5C4; --s6: #E59A62; --s7: #A3AAB3; --s8: #C9A76A;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 18px rgba(0, 0, 0, .25);
    --shadow-lift: 0 14px 34px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1318; --surface: #161D25; --sunk: #1B232D; --ink: #E4E9EF; --muted: #94A1AF; --line: #29333F;
  --accent: #7F9BFF; --accent-ink: #0E1318; --accent-soft: #1F2945; --guide: rgba(127, 155, 255, .06);
  --ok: #4CC08A; --ok-soft: #14302A; --warn: #E3A93B; --warn-soft: #33280F; --crit: #F0766B; --crit-soft: #3A1C1A;
  --s1: #F07A76; --s2: #6E9BF0; --s3: #9B8CF0; --s4: #4CC7A0; --s5: #45B5C4; --s6: #E59A62; --s7: #A3AAB3; --s8: #C9A76A;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 18px rgba(0, 0, 0, .25);
  --shadow-lift: 0 14px 34px rgba(0, 0, 0, .5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.45; }
body.is-dragging { user-select: none; cursor: grabbing; }
.wrap {
  max-width: 1440px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 32px;
  display: flex; flex-direction: column; gap: 14px;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Górny pasek */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; }
.brand { display: flex; flex-direction: column; gap: 2px; min-width: 0; margin-right: auto; }
.brand h1 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 22px; letter-spacing: -.01em; text-wrap: balance; }
.brand .date { color: var(--muted); font-size: 13px; }
.tabs { display: flex; gap: 4px; background: var(--sunk); border: 1px solid var(--line); border-radius: 9px; padding: 3px; }
.tab { border: 0; background: transparent; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-weight: 500; color: var(--muted); }
.tab[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; position: relative; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 12px; border-radius: 8px; cursor: pointer; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.danger { color: var(--crit); border-color: var(--crit); }

.hint { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; font-size: 13px; color: var(--muted); }
.tag { font-family: var(--f-mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; padding: 3px 8px; border-radius: 5px; background: var(--warn-soft); color: var(--warn); }

/* Menu dodawania okien */
.menu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 50; width: min(360px, calc(100vw - 32px)); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow-lift); padding: 8px; max-height: 70vh; overflow: auto; }
.menu h3 { margin: 8px 8px 4px; font-family: var(--f-mono); font-weight: 500; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.menu button { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; width: 100%; text-align: left; border: 0; background: transparent; padding: 8px; border-radius: 7px; cursor: pointer; }
.menu button:hover, .menu button:focus-visible { background: var(--sunk); }
.menu button b { font-weight: 600; }
.menu button span { color: var(--muted); font-size: 12.5px; }

/* Tablica z oknami */
.board { position: relative; min-height: 200px; }
.editing .board { background-image: repeating-linear-gradient(to right, var(--guide) 0 var(--cw, 80px), transparent var(--cw, 80px) calc(var(--cw, 80px) + 12px)); border-radius: 10px; }
.w { position: absolute; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); overflow: hidden; }
.board:not(.stack) .w { transition: left .18s ease, top .18s ease, width .18s ease, height .18s ease, box-shadow .18s; }
.w.dragging { transition: none !important; z-index: 30; box-shadow: var(--shadow-lift); opacity: .96; }
.ph { position: absolute; border: 2px dashed var(--accent); border-radius: 10px; background: var(--accent-soft); opacity: .7; pointer-events: none; }
.w-head { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-bottom: 1px solid var(--line); min-height: 40px; }
.w-title { margin: 0; font-family: var(--f-display); font-weight: 600; font-size: 14px; letter-spacing: .005em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.w-meta { margin-left: auto; font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.w-body { flex: 1; min-height: 0; overflow: auto; padding: 10px 12px; }
.grip, .w-x { display: none; border: 0; background: transparent; padding: 2px; border-radius: 5px; cursor: pointer; color: var(--muted); line-height: 0; }
.w-x:hover { color: var(--crit); background: var(--crit-soft); }
.rz { display: none; position: absolute; right: 0; bottom: 0; width: 20px; height: 20px; cursor: nwse-resize; touch-action: none; }
.rz::after { content: ""; position: absolute; right: 4px; bottom: 4px; width: 9px; height: 9px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); border-radius: 0 0 3px 0; }
.editing .w { border-style: dashed; border-color: var(--muted); }
.editing .w-head { cursor: grab; touch-action: none; background: var(--sunk); }
.editing .grip { display: inline-flex; cursor: grab; }
.editing .w-x { display: inline-flex; }
.editing .rz { display: block; }
.editing .w-meta { margin-left: auto; }
.editing .t-kpi .w-meta { display: none; }

.board.stack { display: flex; flex-direction: column; gap: 12px; height: auto !important; background: none; }
.board.stack .w { position: relative; left: auto !important; top: auto !important; width: auto !important; }

/* Źródła */
.src { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); white-space: nowrap; }
.src::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--muted)); flex: none; }

/* Kafelek */
.t-kpi .w-head { border-bottom: 0; padding-bottom: 0; min-height: 34px; }
.t-kpi .w-body { position: relative; overflow: hidden; padding-top: 2px; display: flex; flex-direction: column; gap: 2px; }
.kpi-num { display: flex; align-items: baseline; gap: 6px; position: relative; z-index: 1; }
.kpi-num b { font-family: var(--f-mono); font-weight: 500; font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; }
.kpi-num span { color: var(--muted); font-size: 12.5px; }
.kpi-sub { font-size: 12px; color: var(--muted); position: relative; z-index: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.spark { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 38%; }
.sp-a { fill: var(--spark); opacity: .12; }
.sp-l { fill: none; stroke: var(--spark); stroke-width: 1.6; }
.st-ok { --spark: var(--ok); } .st-warn { --spark: var(--warn); } .st-crit { --spark: var(--crit); }
.pill { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .05em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.crit { background: var(--crit-soft); color: var(--crit); }
.pill.muted { background: var(--sunk); color: var(--muted); }
.pill.acc { background: var(--accent-soft); color: var(--accent); }

/* Listy */
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.list li { border-bottom: 1px solid var(--line); }
.list li:last-child { border-bottom: 0; }
.row { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 8px 0 8px 10px; text-decoration: none; color: inherit; border-left: 3px solid transparent; }
a.row:hover .row-t { color: var(--accent); }
.row.p-crit { border-left-color: var(--crit); }
.row.p-warn { border-left-color: var(--warn); }
.row.p-ok { border-left-color: var(--line); }
.row-t { font-weight: 500; min-width: 0; }
.row-s { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; font-size: 12px; color: var(--muted); }
.row-age { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); white-space: nowrap; align-self: start; padding-top: 2px; }
.cycle { border: 0; cursor: pointer; }
.cycle:hover { filter: brightness(.95); }

/* Skróty */
.sc { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 8px; }
.sc a { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 4px; border-radius: 8px; border: 1px solid var(--line); text-decoration: none; color: inherit; font-size: 12px; text-align: center; background: var(--sunk); }
.sc a:hover { border-color: var(--accent); }
.sc i { font-style: normal; width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; font-family: var(--f-mono); font-size: 12px; font-weight: 500; color: var(--surface); background: var(--c); }

/* Streszczenie */
.brief p { margin: 0 0 8px; max-width: 65ch; }
.brief strong { font-weight: 600; }
.foot { font-size: 12px; color: var(--muted); }

/* Kalendarz */
.cal li { display: grid; grid-template-columns: 48px 1fr; gap: 2px 10px; padding: 7px 0; border-bottom: 1px solid var(--line); }
.cal li:last-child { border-bottom: 0; }
.cal time { font-family: var(--f-mono); font-size: 12.5px; font-variant-numeric: tabular-nums; padding-top: 1px; }
.cal .now time { color: var(--accent); }
.cal .now .row-t::after { content: " · teraz"; color: var(--accent); font-weight: 500; font-size: 12px; }
.cal .src { grid-column: 2; }

/* Notatka */
.t-note textarea { width: 100%; height: 100%; min-height: 80px; resize: none; border: 0; background: transparent; color: var(--ink); font: inherit; line-height: 1.5; padding: 0; }
.t-note textarea:focus-visible { outline: none; }

/* Gmail na żywo */
.tag.live { background: var(--ok-soft); color: var(--ok); }
.live-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); margin-right: 5px; vertical-align: 1px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 10px; font-size: 12px; cursor: pointer; color: var(--muted); }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.mail .row-t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mail .unread .row-t { font-weight: 600; }
.mail .unread .row-t::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin-right: 7px; vertical-align: 1px; }
.mail .snip { grid-column: 1 / -1; font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.notice { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; padding: 10px 12px; border-radius: 8px; background: var(--sunk); border: 1px solid var(--line); font-size: 13px; margin-bottom: 8px; }
.notice.bad { background: var(--crit-soft); border-color: transparent; color: var(--ink); }
.notice.soft { background: var(--warn-soft); border-color: transparent; }
.empty { color: var(--muted); font-size: 13px; padding: 8px 0; }
.row.live-row .row-age::after { content: " · na żywo"; color: var(--ok); }

.pagefoot { color: var(--muted); font-size: 13px; }

@media (prefers-reduced-motion: reduce) { .board:not(.stack) .w { transition: none; } }
</style>

</div>

  const collide = (a, b) => a.id !== b.id && a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;
  function settle(list, activeId) {
    const act = list.find((i) => i.id === activeId);
    const rest = list.filter((i) => i !== act).sort((a, b) => a.y - b.y || a.x - b.x);
    const placed = act ? [act] : [];
    for (const it of rest) {
      while (placed.some((p) => collide(it, p))) it.y++;
      placed.push(it);
    }
    const order = [...list].sort((a, b) => a.y - b.y || a.x - b.x);
    const done = [];
    for (const it of order) {

        ensureWatch(key);
        const chips = `<div class="chips" role="group" aria-label="Filtr">${Object.entries(GQ).map(([k2, q]) =>
          `<button class="chip" data-gfilter="${k2}" data-wid="${it.id}" aria-pressed="${k2 === key}">${q.label}</button>`).join('')}</div>`;
        const th = threadsOf(key);
        let list;
        if (th) {
          list = th.length
            ? `<ul class="list mail">${th.slice(0, 25).map((t) => `<li class="${t.unread ? 'unread' : ''}"><a class="row ${t.important ? 'p-warn' : 'p-ok'}" href="${t.url}" target="_blank" rel="noopener">` +
              `<span class="row-t">${esc(t.subject)}</span><span class="row-age">${esc(ago(t.date))}</span>` +
              `<span class="snip">${esc(t.sender)} · ${esc(t.snippet)}</span></a></li>`).join('')}</ul>`
            : `<p class="empty">Nic tu nie ma. Skrzynka jest czysta.</p>`;
        } else if (mcpState === 'ready' && !(live[key] && live[key].err)) {
          list = `<p class="empty">Wczytuję skrzynkę…</p>`;
        } else {
          list = `<ul class="list mail">${QUEUE.filter((q) => q.src === 'gmail').map((q) => `<li class="unread"><div class="row p-${q.p}"><span class="row-t">${q.t}</span><span class="row-age">${q.age}</span><span class="snip">Przykład · ${q.s}</span></div></li>`).join('')}</ul>`;
        }
        const n = th ? th.length : null;
        return { title: 'Gmail', meta: (n != null ? n + ' · ' : '') + liveMeta(key), body: chips + notice(key) + list };
      }
      case 'chats': {
        const items = CHATS.filter(inArea);
        const open = items.filter((c) => (chatStatus[c.id] ?? c.st) !== 2).length;
        return {
          title: 'Otwarte czaty AI', meta: `${open} z ${items.length} otwartych`,
          body: `<ul class="list">${items.map((c) => {
            const st = CHAT_ST[chatStatus[c.id] ?? c.st];
            return `<li><div class="row p-ok"><span class="row-t">${c.t}</span>` +
              `<button class="pill ${st.cls} cycle" data-chat="${c.id}" title="Kliknij, żeby zmienić status">${st.n}</button>` +
              `<span class="row-s">${srcChip(c.src)}<span>ostatnio: ${c.last}</span></span></div></li>`;
          }).join('')}</ul>`
        };
      }
      case 'shortcuts': {
        const keys = ['gmail', 'outlook', 'teams', 'gptp', 'gptf', 'claude', 'grok', 'notion', 'x'];
        return {
          title: 'Skróty', meta: '',
          body: `<div class="sc">${keys.map((key) => `<a href="${SRC[key].url}" target="_blank" rel="noopener" style="--c:var(${SRC[key].c})"><i>${SRC[key].ab}</i>${SRC[key].n}</a>`).join('')}</div>`
        };
      }
      case 'brief':
        return {
          title: 'Streszczenie dnia', meta: '7:00',
          body: `<div class="brief"><p><strong>2 sprawy są dziś pilne.</strong> Klient czeka 3 dni na termin wyceny. Wykonawca schodów czeka na potwierdzenie startu.</p>` +
            `<p>W Teams Andrzej pyta o filmiki z warsztatu. Odpowiedź zajmie 2 minuty.</p>` +
            `<p>Masz 23 otwarte czaty AI. 6 z nich nie ruszałeś od tygodnia. Proponuję zamknąć 4.</p>` +
            `<p>Grok ma 7 zleceń w Kolejce X. Wyniki będą jutro rano.</p>` +
            `<p class="foot">Przygotował Claude dziś o 7:00. To przykładowy tekst.</p></div>`
        };
      case 'calendar':
        return {
          title: 'Kalendarz na dziś', meta: `${CAL.length} spotkania`,
          body: `<ul class="list cal">${CAL.map((c) => `<li class="${c.now ? 'now' : ''}"><time>${c.at}</time><span class="row-t">${c.t}</span>${srcChip(c.src)}</li>`).join('')}</ul>`
        };
      case 'grok': {
        ensureWatch('kolejka');
        const rows = rowsOf('kolejka');
        if (rows) {
          const sorted = [...rows].sort((a, b) => ((XST[a.Status] || ['', 5])[1]) - ((XST[b.Status] || ['', 5])[1]));
          return {
            title: 'Kolejka X', meta: `${rows.length} · ${liveMeta('kolejka')}`,
            body: notice('kolejka') + (sorted.length ? `<ul class="list">${sorted.map((r) => {
              const [cls] = XST[r.Status] || ['muted'];
              return `<li><a class="row p-ok" href="${notionUrl(r.url)}" target="_blank" rel="noopener"><span class="row-t">${esc(r.Zlecenie || '(bez nazwy)')}</span>` +
                `<span class="pill ${cls}">${esc(r.Status || 'brak')}</span></a></li>`;
            }).join('')}</ul>` : '<p class="empty">Kolejka jest pusta.</p>')
          };
        }
        return {
          title: 'Kolejka X', meta: liveMeta('kolejka'),
          body: notice('kolejka') + `<ul class="list">${GROK.map((g) => `<li><div class="row p-ok"><span class="row-t">${g.t}</span><span class="pill ${g.cls}">${g.st}</span></div></li>`).join('')}</ul>`
        };
      }
      case 'tasks': {
        ensureWatch('overdue');
        const tasks = overdueTasks();
        const body = tasks
          ? (tasks.length ? `<ul class="list">${tasks.map((t) => `<li><a class="row p-${PRIO[t.prio] || 'ok'}" href="${t.url}" target="_blank" rel="noopener">` +
              `<span class="row-t">${esc(t.name)}</span><span class="row-age">${esc(dayFmt(t.due))}</span>` +
              `<span class="row-s">${t.prio ? `<span>priorytet ${esc(PRIO_PL[t.prio] || t.prio)}</span>` : ''}<span>${t.late != null ? t.late + ' dni po terminie' : ''}</span></span></a></li>`).join('')}</ul>`
              : '<p class="empty">Nic nie jest po terminie.</p>')
          : (mcpState === 'ready' && !(live.overdue && live.overdue.err) ? '<p class="empty">Wczytuję zadania…</p>' : '<p class="empty">Tu pojawią się zadania po terminie z Tasks Tracker.</p>');
        return { title: 'Zadania po terminie', meta: (tasks ? tasks.length + ' · ' : '') + liveMeta('overdue'), body: notice('overdue') + body };
      }
      case 'note':
        return {
          title: 'Notatka', meta: '',
          body: `<textarea id="note-${it.id}" aria-label="Notatka" placeholder="Zapisz tu coś na szybko…"></textarea>`
        };
    }
    return { title: '?', meta: '', body: '' };
  }

  const ICON_GRIP = '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><g fill="currentColor"><circle cx="4" cy="3" r="1.3"/><circle cx="10" cy="3" r="1.3"/><circle cx="4" cy="7" r="1.3"/><circle cx="10" cy="7" r="1.3"/><circle cx="4" cy="11" r="1.3"/><circle cx="10" cy="11" r="1.3"/></g></svg>';
  const ICON_X = '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 3l8 8M11 3l-8 8" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>';

  function build(it) {
    const c = content(it);
    const el = document.createElement('section');
    el.className = `w t-${it.type} ${c.cls || ''}`;
    el.dataset.id = it.id;
    el.setAttribute('aria-label', c.title);
    el.innerHTML =
      `<header class="w-head"><button class="grip" aria-label="Przesuń okno ${c.title}. Strzałki przesuwają, Shift ze strzałkami zmienia rozmiar.">${ICON_GRIP}</button>` +
      `<h2 class="w-title">${c.title}</h2><span class="w-meta">${c.meta}</span>` +
      `<button class="w-x" aria-label="Usuń okno ${c.title}">${ICON_X}</button></header>` +
      `<div class="w-body">${c.body}</div><div class="rz" aria-hidden="true"></div>`;

    el.querySelector('.w-head').addEventListener('pointerdown', (e) => {
      if (e.target.closest('.w-x')) return;
      startDrag(e, it.id, 'move');
    });
    el.querySelector('.rz').addEventListener('pointerdown', (e) => startDrag(e, it.id, 'size'));
    el.querySelector('.w-x').addEventListener('click', () => removeWidget(it.id));
    el.querySelector('.grip').addEventListener('keydown', (e) => keyMove(e, it.id));

    const ta = el.querySelector('textarea');
    if (ta) {
      ta.value = store.get('cd-note-' + it.id, '');
      ta.addEventListener('input', () => store.set('cd-note-' + it.id, ta.value));
    }
    return el;
  }

  function refresh(id) {
    const it = L().find((i) => i.id === id);
    const old = els[id];
    const el = build(it);
    board.replaceChild(el, old);
    els[id] = el;
    layoutAll();
  }

  function geom() {
    const W = board.clientWidth;
    return { cw: (W - GAP * (COLS - 1)) / COLS };
  }
  function placeEl(el, it, g) {
    g = g || geom();
    el.style.left = it.x * (g.cw + GAP) + 'px';
    el.style.top = it.y * (ROWH + GAP) + 'px';
    el.style.width = it.w * g.cw + (it.w - 1) * GAP + 'px';
    el.style.height = it.h * ROWH + (it.h - 1) * GAP + 'px';
  }
  function setBoardHeight() {
    const rows = Math.max(0, ...L().map((i) => i.y + i.h)) + (editing ? 2 : 0);
    board.style.height = Math.max(200, rows * (ROWH + GAP) - GAP) + 'px';
  }

  function layoutAll() {
    if (narrow()) {
      board.classList.add('stack');
      const sorted = [...L()].sort((a, b) => a.y - b.y || a.x - b.x);
      sorted.forEach((it, i) => {
        const el = els[it.id];
        el.style.order = i;
        el.style.height = it.type === 'kpi' ? '120px' : Math.min(it.h, 7) * 46 + 'px';
      });
      return;
    }
    board.classList.remove('stack');
    const g = geom();
    board.style.setProperty('--cw', g.cw + 'px');
    for (const it of L()) {
      const el = els[it.id];
      if (!el) continue;
      el.style.order = '';
      if (!drag || drag.id !== it.id) placeEl(el, it, g);
    }
    setBoardHeight();
  }

  function renderBoard() {
    for (const el of Object.values(els)) el.remove();
    els = {};
    for (const it of L()) {
      const el = build(it);
      board.appendChild(el);
      els[it.id] = el;
    }
    layoutAll();
    document.querySelectorAll('.tab').forEach((t) => t.setAttribute('aria-selected', String(t.dataset.screen === screen)));
  }

  // Przeciąganie i zmiana rozmiaru.
  function startDrag(e, id, mode) {
    if (!editing || narrow() || e.button !== 0) return;
    e.preventDefault();
    const it = L().find((i) => i.id === id);
    drag = { id, mode, sx: e.clientX, sy: e.clientY, start: { ...it }, base: clone(L()) };
    els[id].classList.add('dragging');
    document.body.classList.add('is-dragging');
    ph.hidden = false;
    placeEl(ph, it);
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onUp);
  }
  function onMove(e) {
    if (!drag) return;
    const d = drag, g = geom(), ux = g.cw + GAP, uy = ROWH + GAP;
    const dx = e.clientX - d.sx, dy = e.clientY - d.sy;
    const t = TYPES[d.start.type];
    const next = clone(d.base);
    const a = next.find((i) => i.id === d.id);
    const el = els[d.id];
    if (d.mode === 'move') {
      a.x = clamp(Math.round(d.start.x + dx / ux), 0, COLS - a.w);
      a.y = Math.max(0, Math.round(d.start.y + dy / uy));
      el.style.left = d.start.x * ux + dx + 'px';
      el.style.top = d.start.y * uy + dy + 'px';
    } else {
      a.w = clamp(Math.round(d.start.w + dx / ux), t.minW, COLS - a.x);
      a.h = Math.max(t.minH, Math.round(d.start.h + dy / uy));
      el.style.width = Math.max(t.minW * g.cw, d.start.w * g.cw + (d.start.w - 1) * GAP + dx) + 'px';
      el.style.height = Math.max(t.minH * ROWH, d.start.h * ROWH + (d.start.h - 1) * GAP + dy) + 'px';
    }
    settle(next, d.id);
    layouts[screen] = next;
    for (const it of next) if (it.id !== d.id) placeEl(els[it.id], it, g);
    placeEl(ph, a, g);
    setBoardHeight();
  }
  function onUp() {
    if (!drag) return;
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    window.removeEventListener('pointercancel', onUp);
    els[drag.id].classList.remove('dragging');
    document.body.classList.remove('is-dragging');
    ph.hidden = true;
    drag = null;
    layoutAll();
    save();
    if (liveDirty) rerenderLive();
  }

  function keyMove(e, id) {
    const dirs = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
    if (!editing || !dirs[e.key]) return;
    e.preventDefault();
    const [dx, dy] = dirs[e.key];
    const it = L().find((i) => i.id === id);
    const t = TYPES[it.type];
    if (e.shiftKey) {
      it.w = clamp(it.w + dx, t.minW, COLS - it.x);
      it.h = Math.max(t.minH, it.h + dy);
    } else {
      it.x = clamp(it.x + dx, 0, COLS - it.w);
      it.y = Math.max(0, it.y + dy);
    }
    settle(L(), id);
    layoutAll();
    save();
  }

  function removeWidget(id) {
    layouts[screen] = L().filter((i) => i.id !== id);
    if (els[id]) { els[id].remove(); delete els[id]; }
    settle(L(), null);
    layoutAll();
    save();
  }

  function addWidget(type, cfg) {
    const t = TYPES[type];
    const it = {
      id: 'w' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      type, cfg: cfg || (type === 'queue' || type === 'chats' ? { area: screen } : undefined),
      x: 0, y: Math.max(0, ...L().map((i) => i.y + i.h)), w: t.w, h: t.h
    };
    L().push(it);
    settle(L(), it.id);
    const el = build(it);
    board.appendChild(el);
    els[it.id] = el;
    setEditing(true);
    layoutAll();
    save();
    el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function setEditing(on) {
    editing = on && !narrow();
    document.getElementById('app').classList.toggle('editing', editing);
    editBtn.setAttribute('aria-pressed', String(editing));
    hintText.textContent = narrow()
      ? 'Na telefonie okna są ułożone jedno pod drugim. Układanie działa na szerszym ekranie.'
      : editing
        ? 'Przeciągnij okno za nagłówek. Róg w prawym dolnym rogu zmienia rozmiar. Krzyżyk usuwa okno.'
        : 'Kliknij „Układaj okna”. Potem przeciągnij okno za nagłówek, a róg w prawym dolnym rogu zmienia rozmiar.';
    editBtn.disabled = narrow();
    layoutAll();
  }

  // Menu „Dodaj okno”.
  function buildMenu() {
    const kpis = Object.entries(KPI).map(([key, d]) =>
      `<button data-type="kpi" data-k="${key}"><b>Kafelek: ${d.label}</b><span>${d.value} ${d.unit}</span></button>`).join('');
    const rest = Object.entries(TYPES).filter(([key]) => key !== 'kpi').map(([key, t]) =>
      `<button data-type="${key}"><b>${t.name}</b><span>${t.desc}</span></button>`).join('');
    menu.innerHTML = `<h3>Kafelki ze statusem</h3>${kpis}<h3>Okna</h3>${rest}`;
  }
  function toggleMenu(open) {
    menu.hidden = !open;
    addBtn.setAttribute('aria-expanded', String(open));
    if (open) menu.querySelector('button').focus();
  }
  addBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleMenu(menu.hidden); });
  menu.addEventListener('click', (e) => {
    const b = e.target.closest('button[data-type]');
    if (!b) return;
    toggleMenu(false);
    addWidget(b.dataset.type, b.dataset.k ? { k: b.dataset.k } : undefined);
  });
  document.addEventListener('click', (e) => { if (!menu.hidden && !e.target.closest('.menu')) toggleMenu(false); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !menu.hidden) { toggleMenu(false); addBtn.focus(); } });

  editBtn.addEventListener('click', () => setEditing(!editing));

  let resetArmed = null;
  resetBtn.addEventListener('click', () => {
    if (!resetArmed) {
      resetBtn.textContent = 'Na pewno? Kliknij jeszcze raz';
      resetBtn.classList.add('danger');
      resetArmed = setTimeout(() => { resetArmed = null; resetBtn.textContent = 'Przywróć układ'; resetBtn.classList.remove('danger'); }, 3000);
      return;
    }
    clearTimeout(resetArmed); resetArmed = null;
    resetBtn.textContent = 'Przywróć układ'; resetBtn.classList.remove('danger');
    layouts[screen] = clone(DEFAULTS[screen]);
    save();
    renderBoard();
  });

  document.querySelectorAll('.tab').forEach((t) => t.addEventListener('click', () => {
    screen = t.dataset.screen;
    save();
    renderBoard();
  }));

  let liveDirty = false;
  function rerenderLive() {
    if (drag) { liveDirty = true; return; }
    liveDirty = false;
    for (const it of L()) {
      if (['gmail', 'queue', 'grok', 'tasks'].includes(it.type) || (it.type === 'kpi' && ['gmail', 'overdue', 'grokq'].includes(it.cfg.k))) refresh(it.id);
    }
    const tag = document.getElementById('liveTag');
    const on = [];
    if (Object.keys(GQ).some((k2) => live[k2] && live[k2].data)) on.push('Gmail');
    if (['overdue', 'kolejka'].some((k2) => live[k2] && live[k2].data)) on.push('Notion');
    tag.classList.toggle('live', on.length > 0);
    tag.textContent = on.length ? `Na żywo: ${on.join(' i ')} · reszta to przykłady` : 'Makieta · przykładowe dane';
  }

  board.addEventListener('click', async (e) => {
    const f = e.target.closest('[data-gfilter]');
    if (f) {
      const it = L().find((i) => i.id === f.dataset.wid);
      if (it) { it.cfg = { ...(it.cfg || {}), filter: f.dataset.gfilter }; save(); refresh(it.id); }
      return;
    }
    const ap = e.target.closest('[data-approve]');
    if (ap) { ap.disabled = true; approve(ap.dataset.approve); return; }
    if (e.target.closest('[data-manage]')) {
      const perms = await window.claude?.use?.('permissions');
      if (perms) perms.manage().then(() => location.reload(), () => {});
      return;
    }
    const b = e.target.closest('[data-chat]');
    if (!b) return;
    const c = CHATS.find((x) => x.id === b.dataset.chat);
    chatStatus[c.id] = ((chatStatus[c.id] ?? c.st) + 1) % CHAT_ST.length;
    store.set('cd-chats', chatStatus);
    for (const it of L()) if (it.type === 'chats') refresh(it.id);
  });

  let wasNarrow = narrow();
  new ResizeObserver(() => {
    if (drag) return;
    if (narrow() !== wasNarrow) { wasNarrow = narrow(); setEditing(editing); }
    layoutAll();
  }).observe(board);

  buildMenu();
  renderBoard();
  setEditing(false);

  // Konektor odpowiada później niż pierwszy rysunek strony. Do tego czasu widać przykłady.
  const useMcp = window.claude && typeof window.claude.use === 'function' ? window.claude.use('mcp') : Promise.resolve(null);
  useMcp.then((ns) => {
    mcp = ns;
    mcpState = ns ? 'ready' : 'none';
    renderBoard();
  }, () => { mcpState = 'none'; renderBoard(); });
})();
</script>
