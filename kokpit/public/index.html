<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kokpit</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --fg:#1b1f24; --mute:#667085; --line:#e4e7ec; --ok:#12805c; --warn:#b54708; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14171c; --card:#1d2128; --fg:#e8eaed; --mute:#98a2b3; --line:#2b313a; --ok:#4cc38a; --warn:#f0a05a; } }
  * { box-sizing:border-box } body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 system-ui,sans-serif }
  header { display:flex; gap:12px; align-items:center; padding:14px 16px; border-bottom:1px solid var(--line) }
  h1 { font-size:16px; margin:0; flex:1 } .conn a, .conn span { font-size:13px }
  .grid { display:grid; gap:12px; padding:16px; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)) }
  .brick { background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden }
  .brick h2 { font-size:13px; margin:0; padding:10px 12px; display:flex; justify-content:space-between; border-bottom:1px solid var(--line) }
  .tag { font-weight:500; color:var(--ok) } .tag.demo { color:var(--warn) }
  ul { list-style:none; margin:0; padding:0; max-height:340px; overflow:auto }
  li { padding:8px 12px; border-bottom:1px solid var(--line) } li:last-child { border:0 }
  li a { color:inherit; text-decoration:none; display:block } li.unread .s { font-weight:600 }
  .m { color:var(--mute); font-size:12px } .empty,.err { padding:14px 12px; color:var(--mute) } .err { color:var(--warn) }
</style>
</head>
<body>
<header><h1>Kokpit</h1><div class="conn" id="conn"></div></header>
<main class="grid" id="grid"></main>
<script>
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const get = (u) => fetch(u).then((r) => r.json().then((j) => { if (!r.ok) throw new Error(j.error); return j; }));

async function conn() {
  const { gmail, notion } = await get('/api/status');
  const g = gmail.connected ? '<span class="tag">Gmail połączony</span>'
    : gmail.configured ? '<a href="/auth/google">Połącz Gmail</a>'
    : '<span class="m">Gmail: uzupełnij .env</span>';
  const n = notion.connected ? '<span class="tag">Notion połączony</span>' : '<span class="m">Notion: dodaj NOTION_TOKEN</span>';
  document.getElementById('conn').innerHTML = g + ' &nbsp; ' + n;
}

function render(el, d) {
  const rows = d.items.map((i) => `<li class="${i.unread ? 'unread' : ''}"><a href="${esc(i.url)}" target="_blank" rel="noopener">
    <div class="s">${esc(i.subject)}</div><div class="m">${esc(i.from)} ${esc(i.date)}</div></a></li>`).join('');
  el.querySelector('.tag').textContent = d.demo ? 'DEMO' : `NA ŻYWO · ${d.total}`;
  el.querySelector('.tag').classList.toggle('demo', d.demo);
  el.querySelector('.body').innerHTML = rows ? `<ul>${rows}</ul>` : '<div class="empty">Pusto</div>';
}

async function mount(b) {
  const el = document.createElement('section');
  el.className = 'brick';
  el.innerHTML = `<h2>${esc(b.title)}<span class="tag">…</span></h2><div class="body"><div class="empty">Ładuję…</div></div>`;
  document.getElementById('grid').append(el);
  const tick = () => get('/api/brick/' + b.id).then((d) => render(el, d))
    .catch((e) => { el.querySelector('.body').innerHTML = `<div class="err">${esc(e.message)}</div>`; });
  tick(); setInterval(tick, b.refreshMs);
}

conn(); get('/api/bricks').then((list) => list.forEach(mount));
</script>
</body>
</html>
