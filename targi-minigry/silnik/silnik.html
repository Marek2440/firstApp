<canvas id="c" width="1152" height="768"></canvas>
<script>const G = [];</script>
<script src="rdzen.js"></script>
<script src="gry1-3.js"></script>
<script src="gry4-6.js"></script>
<script src="gry7-10.js"></script>
<script>
G.sort((a, b) => a.n - b.n);
window.render = (n, t) => {
  const Gm = G.find(x => x.n === n);
  frame(Gm, t); Gm.fn(t); intro(Gm, t);
  if (Gm.out) outro(Gm, t, Gm.out[0], Gm.out[1]);
};
window.meta = () => G.map(x => ({ n: x.n, title: x.title, dur: x.dur }));
</script>
